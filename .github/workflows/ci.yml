name: MSAP Alumni CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msap-alumni-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: msap-alumni-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run Backend Security Scan
        run: npm run scan

      - name: Run Backend Unit & Supabase Fallback Tests
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: supersecrettestjwtkeyformocksuitewhichis32charslong!
          ADMIN_JWT_SECRET: supersecretadminjwtkeyformocksuitewhichis32charslong!
          COOKIE_SECRET: testcookiesecretkey32charslong!!
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          FRONTEND_ORIGIN: http://localhost:5173
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mock.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock' }}
        run: npm test

  frontend-test-and-build:
    name: Frontend Lint, UI Unit Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msap-alumni-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: msap-alumni-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run UI Unit Tests (Vitest)
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build
